<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Telegram Notifications</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: #0088cc;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin: 10px 5px;
    }
    button:hover {
      background: #006699;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>
  <h1>🧪 Telegram Notification Test</h1>
  <p>Click the button to test if Telegram notifications are working:</p>
  
  <button onclick="testTelegram()">Send Test Notification</button>
  <button onclick="testVisit()">Trigger Visit Notification</button>
  <button onclick="testClick()">Trigger Click Notification</button>
  
  <div id="result" class="result"></div>

  <h2>Test Log:</h2>
  <div id="log" style="background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; white-space: pre-wrap;"></div>

  <script>
    const logEl = document.getElementById('log');
    const resultEl = document.getElementById('result');

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      logEl.textContent += `[${timestamp}] ${message}\n`;
      console.log(message);
    }

    async function testTelegram() {
      log('Testing Telegram API directly...');
      resultEl.style.display = 'none';
      
      try {
        const response = await fetch('/.netlify/functions/telegram-proxy/sendMessage', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text: '🧪 <b>Direct API Test</b>\n\nThis is a test notification from the test page!\n\nTime: ' + new Date().toLocaleString(),
            parse_mode: 'HTML',
            disable_web_page_preview: true
          })
        });
        
        const data = await response.json();
        log('Response received: ' + JSON.stringify(data));
        
        if (data.ok) {
          resultEl.className = 'result success';
          resultEl.textContent = '✅ SUCCESS! Notification sent to Telegram (Message ID: ' + data.result.message_id + ')';
          resultEl.style.display = 'block';
          log('✅ Test PASSED');
        } else {
          resultEl.className = 'result error';
          resultEl.textContent = '❌ FAILED! Error: ' + (data.description || 'Unknown error');
          resultEl.style.display = 'block';
          log('❌ Test FAILED: ' + (data.description || 'Unknown error'));
        }
      } catch (error) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ FAILED! Network error: ' + error.message;
        resultEl.style.display = 'block';
        log('❌ Network error: ' + error.message);
      }
    }

    function testVisit() {
      log('Triggering visit notification via telegram.js...');
      if (window.telegramNotify) {
        window.telegramNotify('🧪 Test Visit', ['This is a test visit notification', 'Triggered manually from test page']);
        resultEl.className = 'result success';
        resultEl.textContent = '✅ Visit notification triggered! Check Telegram.';
        resultEl.style.display = 'block';
        log('✅ Visit notification sent via telegramNotify()');
      } else {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ telegram.js not loaded! telegramNotify function not found.';
        resultEl.style.display = 'block';
        log('❌ ERROR: telegramNotify function not found');
      }
    }

    function testClick() {
      log('Simulating click event...');
      const fakeButton = document.createElement('button');
      fakeButton.textContent = 'Fake Test Button';
      fakeButton.setAttribute('aria-label', 'Test Click Button');
      document.body.appendChild(fakeButton);
      
      setTimeout(() => {
        fakeButton.click();
        log('✅ Click event triggered on fake button');
        resultEl.className = 'result success';
        resultEl.textContent = '✅ Click simulated! If telegram.js is working, a notification should be sent.';
        resultEl.style.display = 'block';
        
        setTimeout(() => {
          document.body.removeChild(fakeButton);
        }, 100);
      }, 100);
    }

    // Log when page loads
    log('Test page loaded');
    log('Checking for telegram.js...');
    
    window.addEventListener('load', () => {
      if (window.telegramNotify) {
        log('✅ telegram.js is loaded and ready');
      } else {
        log('❌ telegram.js NOT found - notifications will not work');
      }
    });
  </script>
  
  <!-- Load telegram.js -->
  <script src="js/telegram.js"></script>
</body>
</html>
